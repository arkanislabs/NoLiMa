# Full NoLiMa run with RAG: 5 haystacks x 58 tests x 26 depths = 7,540 requests.
# Run from evaluation/:
#   PYTHONPATH=../ TOKENIZERS_PARALLELISM=false uv run python -u run_tests.py --config run_config/nolima_deepseek_v4.1_flash_1017_nothink_openrouter_rag_c1000_k3_8K.yaml
model_name: "deepseek_v4.1_flash_1017_nothink_openrouter"
model_configs_dir: "./model_configs/"
needle_set_path: "../data/needlesets/needle_set.json"
haystack_dir: "../data/haystack/rand_shuffle"
parent_results_dir: "./results/deepseek_v4.1_flash_1017_nothink_openrouter_rag_c1000_k3/CL8K/"
context_length: 8000
document_depth_percent_min: 0
document_depth_percent_max: 100
document_depth_percent_intervals: 26
metric: contains
use_default_system_prompt: true
# RAG baseline: answer from the top_k chunks of the haystack (hybrid BM25 + text-embedding-3-small, RRF k=60)
rag:
  chunk_size: 1000
  chunk_overlap: 200
  top_k: 3
  embedding_model: text_embedding_3_small_openrouter
