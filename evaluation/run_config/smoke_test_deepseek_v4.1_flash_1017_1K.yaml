# Smoke test: 1 haystack x 2 tests x 3 depths = 6 requests.
# Run from evaluation/:
#   PYTHONPATH=../ uv run python -u run_tests.py --config run_config/smoke_test_deepseek_v4.1_flash_1017_1K.yaml
model_name: "deepseek_v4.1_flash_1017_openrouter"
model_configs_dir: "./model_configs/"
needle_set_path: "../data/needlesets/needle_set.json"
haystack_dir: "../data/haystack/rand_shuffle"
parent_results_dir: "./results/smoke_deepseek_v4.1_flash_1017_openrouter/CL1K/"
context_length: 1000
document_depth_percent_min: 0
document_depth_percent_max: 100
document_depth_percent_intervals: 3
metric: contains
use_default_system_prompt: true
haystack_files:
  - rand_book_1.txt
test_names:
  - 0401_T17_C02_onehop
  - 0401_T17_C02_twohop
