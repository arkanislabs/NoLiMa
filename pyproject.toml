[project]
name = "nolima"
version = "0.1.0"
description = "NoLiMa: Long-Context Evaluation Beyond Literal Matching"
readme = "README.md"
requires-python = ">=3.10,<3.13"
# Core: everything needed to run evaluations against API providers
# (OpenAI, Azure OpenAI, Gemini/Vertex AI, AWS Bedrock) and against a vllm server.
dependencies = [
    "openai==1.53.0",
    "tiktoken==0.7.0",
    "transformers==4.46.1",
    "google-genai==0.3.0",
    "google-cloud-aiplatform[tokenization]==1.74.0",
    "langchain-aws==0.2.9",
    "langchain-core==0.3.26",
    "tenacity==9.0.0",
    "jsonargparse==4.34.0",
    "httpx<0.28",
    "numpy",
    "tqdm",
]

[dependency-groups]
# Local inference: serve open models with vllm (Linux + NVIDIA GPU only).
local = [
    "vllm>=0.6; sys_platform == 'linux'",
]

[tool.uv]
package = false
# sentencepiece 0.2.3 ships no Intel-macOS wheel (it fails to build from source there).
constraint-dependencies = ["sentencepiece<0.2.3"]
